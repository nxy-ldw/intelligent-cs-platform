<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能客服系统教学平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #8b5cf6;
      --accent: #06b6d4;
      --text-dark: #1e293b;
      --text-light: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      overflow: hidden;
    }
    .bg-decoration {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      z-index: 0;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: #6366f1;
      top: -150px; left: -100px;
      animation: float1 8s ease-in-out infinite;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: #8b5cf6;
      bottom: -100px; right: -50px;
      animation: float2 10s ease-in-out infinite;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: #06b6d4;
      top: 50%; left: 60%;
      animation: float3 12s ease-in-out infinite;
    }
    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 50px) scale(1.1); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-40px, -30px) scale(1.05); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-30px, 40px) scale(0.9); }
    }
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 0 24px;
    }
    .login-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
    }
    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 10px 30px rgba(99,102,241,0.4);
    }
    .login-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 14px;
      color: var(--text-light);
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #94a3b8;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px 12px 44px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-dark);
      transition: all 0.25s;
      background: white;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 8px 20px rgba(99,102,241,0.3);
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(99,102,241,0.4);
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-light);
    }
    .role-hint {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      font-size: 12px;
      color: #64748b;
    }
    .role-hint .hint-icon { font-size: 16px; }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      min-height: 18px;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bg-decoration">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-area">
        <div class="logo-icon">🤖</div>
        <h1 class="login-title">智能客服系统</h1>
        <p class="login-subtitle">基于医学知识库的智能应答系统教学平台</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" class="form-control" id="username" placeholder="请输入用户名" autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-control" id="password" placeholder="请输入密码" autocomplete="current-password">
          </div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="btn-login" id="loginBtn">
          登 录
        </button>
      </form>

      <div class="role-hint">
        <span class="hint-icon">💡</span>
        <span>系统包含学生端、教师端和管理端，登录后自动跳转到对应端</span>
      </div>

      <div class="login-footer">
        © 2026 智能客服系统教学平台
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = localStorage.getItem('user');
    if (token && user) {
      const u = JSON.parse(user);
      const routes = { admin: '/admin', teacher: '/teacher', student: '/student' };
      window.location.href = routes[u.role] || '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        errorMsg.textContent = '请输入用户名和密码';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 登录中...';
      errorMsg.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '登录失败');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));

        const routes = { admin: '/admin', teacher: '/teacher', student: '/student' };
        window.location.href = routes[data.user.role] || '/';
      } catch (err) {
        errorMsg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
